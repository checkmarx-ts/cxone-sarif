[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cxone-sarif"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "sarif-om>=1.0.4",
    "jsonpath-ng>=1.8.0",
    "jschema-to-python>=1.2.3",
    "dataclasses-json>=0.6.7",
    "aiofiles>=25.1.0",
    "cxone-async-api==1.1.9"
]

[project.urls]
Homepage = "https://github.com/checkmarx-ts/cxone-sarif"
Repository = "https://github.com/checkmarx-ts/cxone-sarif"
Documentation = "https://github.com/checkmarx-ts/cxone-sarif"


description = "Transforms CheckmarxOne results to a standard-compliant Sarif log."
requires-python = ">=3.10"

[project.scripts]
cxone-sarif = "cxone_sarif.__main__:cli_entry"

[tool.setuptools]
package-dir = {"cxone_sarif" = "cxone_sarif"}

[tool.setuptools.dynamic]
version = { attr = "cxone_sarif.__version__.__version__" }

[project.optional-dependencies]
cli = [
  "docopt-ng==0.9.0",
  "tqdm==4.70.0"
]

