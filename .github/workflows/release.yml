name: Publish a Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version tag to use in the form of x.x.x"
        required: true
        type: string
      prerelease:
        description: "Check if this is to publish a pre-release."
        required: true
        type: boolean

permissions:
  contents: read

env:
  VIRTUALENV_NO_PERIODIC_UPDATE: 1
  PIP_INDEX_URL: https://:${{ secrets.ECHO_LIBRARIES_ACCESS_KEY }}@pypi.echohq.com/simple  

jobs:
  tag-repo:
    runs-on: cx-public-ubuntu-x64
    outputs:
      tag: ${{ steps.tag-string.outputs.tag }}
      release_version: ${{ steps.tag-string.outputs.release_version }}
    permissions:
      contents: write
    steps:
      - name: Create tag
        id: tag-string
        run: |

          [ ${{ inputs.prerelease }} = false ] && echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT || \
            echo "tag=${{ inputs.version }}rc$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT

          echo "release_version=${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Validate no tag
        run: |
          git clone --branch ${{ steps.tag-string.outputs.tag }} --depth=1 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY > /dev/null 2>&1 && exit 1 || :

      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set Tag
        run: |
          git config --global user.email "${{ github.triggering_actor }}"
          git config --global user.name "${{ github.triggering_actor }}"
          git tag '${{ steps.tag-string.outputs.tag }}'
          git push origin '${{ steps.tag-string.outputs.tag }}'


  build-wheel:
    needs: [tag-repo]
    uses: ./.github/workflows/build-wheel.yml
    secrets: inherit
    with:
      tag: ${{ needs.tag-repo.outputs.tag }}
      prerelease: ${{ inputs.prerelease }}

  publish-release:
    runs-on: cx-public-ubuntu-x64
    needs: [tag-repo, build-wheel]
    permissions:
      contents: write
    steps:

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Upgrade pip
        shell: bash
        run: |
          pip install --upgrade pip

      - name: Download wheel artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ github.run_number }}
          path: ./dist

      - name: Make release text header
        run: |
          echo "# Checkmarx One Sarif API and CLI ${{ needs.tag-repo.outputs.tag }}" > release.md

          python3 ./.github/workflows/scripts/json2md.py ./release-notes.json ${{ needs.tag-repo.outputs.release_version }} >> release.md

          echo '' >> release.md
          echo '' >> release.md
          echo '## Installation' >> release.md


      - name: Make pre-release text
        if: ${{ inputs.prerelease }}
        run: |
          WHEEL_NAME=$(basename $(ls dist/*.whl))
          WHEEL_HASH=$(pip3 hash dist/$WHEEL_NAME | grep "^--")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.tag-repo.outputs.tag }}/$WHEEL_NAME"

          echo 'This is a pre-release and is not published to PyPI.' >> release.md
          echo 'Install the package directly from the Github release by adding the following line to your `requirements.txt` file:' >> release.md
          echo '```' >> release.md
          echo $RELEASE_URL >> release.md
          echo '```' >> release.md

          echo 'Installation of the CLI can be performed by executing the following in a command shell:' >> release.md
          echo '```' >> release.md
          echo pip install cxone-sarif[cli]@$RELEASE_URL >> release.md
          echo '```' >> release.md

          echo "## Hashes" >> release.md
          echo "### $WHEEL_NAME" >> release.md
          echo '```' >> release.md
          echo "$WHEEL_HASH" >> release.md
          echo '```' >> release.md

      - name: Make release text
        if: ${{ ! inputs.prerelease }}
        run: |
          echo 'You can install the package from PyPI by adding the following line to your `requirements.txt` file:' >> release.md
          echo '```' >> release.md
          echo cxone-sarif==${{ needs.tag-repo.outputs.tag }} >> release.md
          echo '```' >> release.md


      - name: Create GitHub release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          allowUpdates: false
          immutableCreate: true
          artifactErrorsFailBuild: true
          artifacts: ./dist/*.whl
          bodyFile: release.md
          name: ${{ needs.tag-repo.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          tag: ${{ needs.tag-repo.outputs.tag }}


  publish-pypi:
    runs-on: cx-public-ubuntu-x64
    needs: [publish-release]
    if: ${{ ! inputs.prerelease }}
    permissions:
      id-token: write
    steps:

      - name: Download wheel artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ github.run_number }}
          path: ./dist

      - name: PyPI Publish
        uses: step-security/gh-action-pypi-publish@ef63b3f651e4131083ceb916595ce721a1959385 # v1.14.0
        with:
          verbose: true


  artifact-cleanup:
    runs-on: cx-public-ubuntu-x64
    needs: [publish-release, publish-pypi]
    if: always()
    steps:
      - uses: step-security/delete-artifact@9a5b2d6793eb97cf052deddb87cd073aabb77385 # v6.0.0
        with:
          name: wheel-${{ github.run_number }}

  remove-tag-on-failure:
    needs: [publish-pypi, publish-release, tag-repo]
    runs-on: cx-public-ubuntu-x64
    permissions:
      contents: write
    if: ${{ (failure() || cancelled()) && needs.tag-repo.result == 'success' }}
    steps:
      - name: Fetch Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Remove CodeTag
        run: git push origin ':refs/tags/${{ needs.tag-repo.outputs.tag }}'
